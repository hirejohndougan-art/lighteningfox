[package]
name = "ironswift-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

# Fuzzing for Ironswift's own parsers (HTML, XHTML, CSS, selectors) and Boa's JavaScript parser.
#   Coverage-guided (needs nightly):  cargo +nightly fuzz run html
#   Quick check on stable:            cargo run --release --bin smoke -- 200000
# See README.md in this folder.

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
boa_parser = "0.22"
boa_interner = "0.22"
boa_ast = "0.22"

[profile.release]
debug = 1

# Not part of the browser's own build.
[workspace]
members = ["."]

[[bin]]
name = "html"
path = "fuzz_targets/html.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html_fragment"
path = "fuzz_targets/html_fragment.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xhtml"
path = "fuzz_targets/xhtml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "css"
path = "fuzz_targets/css.rs"
test = false
doc = false
bench = false

[[bin]]
name = "javascript"
path = "fuzz_targets/javascript.rs"
test = false
doc = false
bench = false

[[bin]]
name = "smoke"
path = "src/bin/smoke.rs"
test = false
doc = false
bench = false
