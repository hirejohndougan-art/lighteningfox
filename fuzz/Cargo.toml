[package]
name = "ironswift-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
boa_engine = "0.22"
url = "2.5"
regress = "0.12"
base64 = "0.22"
sha2 = "0.10"

# Not part of any workspace above.
[workspace]
members = ["."]

[[bin]]
name = "html"
path = "fuzz_targets/html.rs"
test = false
doc = false
bench = false

[[bin]]
name = "css"
path = "fuzz_targets/css.rs"
test = false
doc = false
bench = false

[[bin]]
name = "js"
path = "fuzz_targets/js.rs"
test = false
doc = false
bench = false

[[bin]]
name = "csp"
path = "fuzz_targets/csp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filters"
path = "fuzz_targets/filters.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jit_diff"
path = "fuzz_targets/jit_diff.rs"
test = false
doc = false
bench = false
required-features = ["jit"]

[features]
# The `jit_diff` target: Ironswift's Boa (vendor/boa) with the baseline JIT built in.
jit = ["boa_engine/jit"]

# Ironswift's own copy of Boa, as the browser uses it.
[patch.crates-io]
boa_engine = { path = "../vendor/boa/boa_engine" }
boa_gc = { path = "../vendor/boa/boa_gc" }
boa_ast = { path = "../vendor/boa/boa_ast" }
boa_parser = { path = "../vendor/boa/boa_parser" }
boa_interner = { path = "../vendor/boa/boa_interner" }
boa_string = { path = "../vendor/boa/boa_string" }
boa_macros = { path = "../vendor/boa/boa_macros" }
