<!DOCTYPE html>
<html><head><title>Dotted and dashed borders</title></head>
<body style="margin:12px;font-family:sans-serif;font-size:14px">
<div style="border:4px dotted #e11d48;padding:10px;width:260px;margin-bottom:12px">4px dotted: round dots</div>
<div style="border:2px dotted #0f172a;padding:10px;width:260px;margin-bottom:12px">2px dotted</div>
<div style="border:3px dashed #16a34a;padding:10px;width:260px;margin-bottom:12px">3px dashed</div>
<div style="border:8px dotted #7c3aed;padding:10px;width:260px">8px dotted</div>
</body></html>
