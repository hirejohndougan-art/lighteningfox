<!doctype html>
<!-- From BBC News (2026-11): section titles ("MORE TO EXPLORE") are letter-spaced headings in a
     flex item that sizes to its content. The spacing after the last letter must count in that
     size, or the item is a little too narrow and the title wraps one word per line. -->
<html><head><title>Letter spacing and shrink-to-fit</title></head>
<body>
<div style="display: flex; justify-content: space-between"><div><h2 id="t" style="font-size: 15px; line-height: 20px; letter-spacing: 0.75px; text-transform: uppercase; margin: 0">More to explore</h2></div></div>
<p id="out"></p>
<script>
  document.getElementById("out").textContent = String(document.getElementById("t").getBoundingClientRect().height);
</script>
</body></html>
