<!doctype html>
<!-- WordPress.org (2026-11) global header: a flex row with the menu (flex-basis: 100% and
     order: unset in the same rule), a search form at width: 100%, and a "Get WordPress" button
     whose link is a block with a background. The menu takes the free width; the button stays
     as wide as its text. -->
<html><head><title>WP header</title>
<style>
  body { margin: 0; font-family: sans-serif }
  header { display: flex; align-items: flex-start; width: 1000px }
  .logo { width: 48px; height: 40px; background: #333 }
  nav.main { flex-basis: 100%; flex-shrink: 1; order: unset; overflow: clip; background: #cfc }
  .search form { width: 100%; display: flex }
  .get { display: inline; padding: 10px }
  .get a { display: block; background: blue; color: white; padding: 4px 16px }
</style></head>
<body><header><div class="logo"></div><nav class="main" id="nav">Showcase Plugins Themes</nav>
<div class="search" id="search"><form><input size="6"></form></div>
<div class="get" id="get"><a href="#">Get WordPress</a></div></header><p id="out"></p>
<script>
  const w = (id) => Math.round(document.getElementById(id).getBoundingClientRect().width);
  document.getElementById("out").textContent = [w("nav") > 600, w("get") < 250, w("search") < 250].join(";");
</script></body></html>
