<!doctype html>
<!-- ffmpeg.wasm (@ffmpeg/core 0.12, single-threaded, 2026-11): Emscripten emits atomic
     instructions even with no threads. On memory that isn't shared they act like plain loads
     and stores, so the module must compile and run; a shared memory still needs threads. -->
<html><head><title>wasm atomics</title></head>
<body><pre id="out"></pre>
<script>
const atomics = new Uint8Array([0,97,115,109,1,0,0,0,1,25,4,96,2,127,127,1,127,96,3,127,127,127,1,127,96,2,127,126,1,126,96,1,127,1,127,3,6,5,0,1,2,3,3,5,3,1,0,1,7,45,6,3,109,101,109,2,0,3,97,100,100,0,0,4,99,97,115,56,0,1,6,120,99,104,103,54,52,0,2,4,108,111,97,100,0,3,6,110,111,116,105,102,121,0,4,10,59,5,10,0,32,0,32,1,254,30,2,0,11,12,0,32,0,32,1,32,2,254,74,0,0,11,10,0,32,0,32,1,254,66,3,0,11,11,0,254,3,0,32,0,254,16,2,0,11,10,0,32,0,65,1,254,0,2,0,11]);
const shared = new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,127,3,2,1,0,5,4,1,3,1,1,7,5,1,1,102,0,0,10,10,1,8,0,65,0,254,16,2,0,11]);
const out = [];
try {
  out.push(WebAssembly.validate(atomics));
  const e = new WebAssembly.Instance(new WebAssembly.Module(atomics)).exports;
  const u32 = new Uint32Array(e.mem.buffer);
  u32[1] = 40;
  out.push(e.add(4, 2), u32[1]);            // returns the old value, stores the sum
  u32[2] = 0x1ff;
  out.push(e.cas8(8, 0x3ff, 7), u32[2]);    // compares the low byte only (0xff == 0x3ff & 0xff): old 255, now 0x107
  out.push(e.cas8(8, 1, 9), u32[2]);        // no match: unchanged
  out.push(String(e.xchg64(16, 5n)), String(e.xchg64(16, 6n)));
  out.push(e.load(4), e.notify(4));
  out.push(WebAssembly.validate(shared));
} catch (err) {
  out.push("error " + err);
}
document.getElementById("out").textContent = out.join(",");
</script></body></html>
