<!doctype html>
<!-- AP News (2026-11): a script shuffles with arr.sort(() => Math.random() - 0.5). An
     inconsistent comparator gives an unspecified order, but must never crash the browser. -->
<html><head><title>Random sort</title></head><body><p id="out"></p>
<script>
  const a = Array.from({ length: 300 }, (_, i) => i);
  for (let k = 0; k < 20; k++) a.sort(() => Math.random() - 0.5);
  const same = [...a].sort((x, y) => x - y).every((v, i) => v === i);
  const typed = new Float64Array(a).sort((x, y) => (Math.random() < 0.5 ? -1 : 1));
  const stable = [{ k: 1, n: "a" }, { k: 0, n: "b" }, { k: 1, n: "c" }, { k: 0, n: "d" }].sort((x, y) => x.k - y.k).map((o) => o.n).join("");
  document.getElementById("out").textContent = same + " " + typed.length + " " + stable;
</script></body></html>
