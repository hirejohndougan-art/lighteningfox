<!DOCTYPE html><html><head><title>Web Audio</title></head><body>
<p id=out></p><p id=errs></p>
<script>
const out = document.getElementById("out"), errs = document.getElementById("errs");
// The usual audio fingerprint: a triangle wave through a compressor, rendered offline.
function fingerprint() {
  const ctx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 5000, 44100);
  const osc = ctx.createOscillator();
  osc.type = "triangle";
  osc.frequency.value = 10000;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -50; comp.knee.value = 40; comp.ratio.value = 12; comp.attack.value = 0; comp.release.value = 0.25;
  osc.connect(comp); comp.connect(ctx.destination);
  osc.start(0);
  return ctx.startRendering().then((buf) => {
    let sum = 0;
    for (const v of buf.getChannelData(0).slice(4500)) sum += Math.abs(v);
    return sum;
  });
}
// A known constant: noise shows up as values that aren't exactly 0.5.
function constant() {
  const ctx = new OfflineAudioContext({ numberOfChannels: 1, length: 2048, sampleRate: 48000 });
  const c = ctx.createConstantSource();
  c.offset.value = 0.5;
  c.connect(ctx.destination);
  c.start();
  let completed = false;
  ctx.oncomplete = (e) => { completed = e.renderedBuffer.length === 2048; };
  return ctx.startRendering().then((b) => {
    const d = b.getChannelData(0);
    let changed = 0, maxRel = 0;
    for (const v of d) if (v !== Math.fround(0.5)) { changed++; maxRel = Math.max(maxRel, Math.abs(v / 0.5 - 1)); }
    return [changed, maxRel, completed, Array.from(d)];
  });
}
// An analyser on a 1 kHz tone: the loudest bin is where it should be.
function analyser() {
  const ctx = new OfflineAudioContext(1, 8192, 48000);
  const osc = new OscillatorNode(ctx, { frequency: 1000 });
  const an = ctx.createAnalyser();
  an.fftSize = 1024;
  const g = new GainNode(ctx, { gain: 0.5 });
  osc.connect(g); g.connect(an); an.connect(ctx.destination);
  osc.start();
  return ctx.startRendering().then(() => {
    const f = new Float32Array(an.frequencyBinCount);
    an.getFloatFrequencyData(f);
    let best = 0;
    for (let i = 1; i < f.length; i++) if (f[i] > f[best]) best = i;
    const bytes = new Uint8Array(an.frequencyBinCount);
    an.getByteFrequencyData(bytes);
    return [best, Math.round(1000 / (48000 / 1024)), bytes[best] > 200];
  });
}
// A lowpass filter's response at its cutoff, and an error for a bad buffer.
const checks = [];
try {
  const ctx = new OfflineAudioContext(1, 128, 44100);
  const bq = ctx.createBiquadFilter();
  bq.frequency.value = 1000;
  const m = new Float32Array(2), p = new Float32Array(2);
  bq.getFrequencyResponse(new Float32Array([100, 10000]), m, p);
  checks.push(m[0] > 0.9 && m[1] < 0.05);
  try { ctx.createBuffer(1, 0, 44100); } catch (e) { checks.push(e.name); }
  checks.push(typeof AudioContext, typeof webkitAudioContext);
  window.__fpSeed = () => 0; // a page can't turn the noise off
} catch (e) { checks.push("threw " + e); }
Promise.all([fingerprint(), fingerprint(), constant(), constant(), analyser()]).then(([a, b, c1, c2, an]) => {
  const same = c1[3].every((v, i) => v === c2[3][i]);
  out.textContent = [a > 0 && isFinite(a), a === b, c1[0] > 0, c1[1] < 1e-5, c1[2], same, an[0] === an[1], an[2]].join(",");
  errs.textContent = checks.join(",");
}).catch((e) => { errs.textContent = "failed: " + e; out.textContent = "x"; });
</script></body></html>
