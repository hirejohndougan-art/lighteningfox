<!DOCTYPE html>
<html><head><title>Gradients and background layers</title>
<style>
body { font: 13px sans-serif; margin: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
.t { width: 150px; height: 100px; border: 1px solid #94a3b8; }
p { margin: 2px 0 0; }
</style></head>
<body>
<div class="row">
  <div><div class="t" style="background: conic-gradient(#ef4444 0 25%, #22c55e 25% 50%, #3b82f6 50% 75%, #111827 75%)"></div><p>conic quarters</p></div>
  <div><div class="t" style="background: conic-gradient(from 90deg at 30% 40%, red, yellow, lime, aqua, blue, magenta, red)"></div><p>conic from 90deg at 30% 40%</p></div>
  <div><div class="t" style="border-radius: 50%; background: conic-gradient(#f59e0b 0 70%, #e5e7eb 70%)"></div><p>70% pie</p></div>
  <div><div class="t" style="background: repeating-linear-gradient(45deg, #fde047 0 10px, #111827 10px 20px)"></div><p>repeating 45° stripes</p></div>
  <div><div class="t" style="background: repeating-radial-gradient(circle at 30% 50%, #2563eb 0 6px, #fff 6px 12px)"></div><p>repeating radial rings</p></div>
  <div><div class="t" style="background: repeating-conic-gradient(#d1d5db 0 25%, #fff 0 50%) 0 0 / 20px 20px"></div><p>checkerboard (conic tile)</p></div>
</div>
<div class="row">
  <div><div class="t" style="background: radial-gradient(circle closest-side, #a855f7, #fff)"></div><p>circle closest-side</p></div>
  <div><div class="t" style="background: radial-gradient(ellipse at top left, #f97316, transparent 70%), #e0f2fe"></div><p>ellipse at top left over a color</p></div>
  <div><div class="t" style="background: linear-gradient(to right, rgba(255,0,0,.8), transparent), linear-gradient(to bottom, rgba(0,0,255,.8), transparent), #fff"></div><p>two crossing layers</p></div>
  <div><div class="t" style="background: url(img/logo.svg) center / 60px no-repeat, url(img/checker.png) 0 0 / 16px 16px, #fff"></div><p>image over a tiled image</p></div>
  <div><div class="t" style="background-image: url(img/logo.svg), linear-gradient(135deg, #34d399, #3b82f6); background-repeat: no-repeat, no-repeat; background-position: right 4px bottom 4px, 0 0; background-size: 48px, auto"></div><p>longhand lists</p></div>
</div>
</body></html>
