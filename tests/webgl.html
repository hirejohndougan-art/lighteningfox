<!doctype html>
<html><head><meta charset="utf-8"><title>WebGL</title>
<style>
  body { font: 14px sans-serif; margin: 12px; background: #f8fafc; }
  canvas { border: 1px solid #94a3b8; margin: 0 8px 8px 0; vertical-align: top; }
  #log { font: 12px monospace; white-space: pre; }
</style></head>
<body>
<h3>WebGL</h3>
<canvas id="tri" width="200" height="150"></canvas>
<canvas id="tex" width="200" height="150"></canvas>
<canvas id="cube" width="200" height="150"></canvas>
<canvas id="gl2" width="200" height="150"></canvas>
<canvas id="fx" width="200" height="150"></canvas>
<canvas id="copy" width="200" height="150"></canvas>
<div id="log"></div>
<script>
const log = (s) => (document.getElementById("log").textContent += s + "\n");
function prog(gl, vs, fs) {
  const mk = (t, s) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) log("compile: " + gl.getShaderInfoLog(sh)); return sh; };
  const p = gl.createProgram();
  gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) log("link: " + gl.getProgramInfoLog(p));
  gl.useProgram(p);
  return p;
}
function buf(gl, data, attr, size, p) {
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(p, attr); gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
  return b;
}

// 1. A colour-interpolated triangle on a cleared background.
{
  const gl = document.getElementById("tri").getContext("webgl");
  const p = prog(gl, "attribute vec2 a_pos; attribute vec3 a_col; varying vec3 v_col;\nvoid main() { v_col = a_col; gl_Position = vec4(a_pos, 0.0, 1.0); }",
    "precision mediump float; varying vec3 v_col; void main() { gl_FragColor = vec4(v_col, 1.0); }");
  gl.clearColor(0.1, 0.12, 0.2, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  buf(gl, [0, 0.85, -0.85, -0.8, 0.85, -0.8], "a_pos", 2, p);
  buf(gl, [1, 0, 0, 0, 1, 0, 0, 0, 1], "a_col", 3, p);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  log("1 triangle: error " + gl.getError() + ", " + gl.getParameter(gl.VERSION));
}

// 2. A texture drawn from a 2D canvas, with mipmaps and repeat, blended over a checker.
{
  const src = document.createElement("canvas"); src.width = 64; src.height = 64;
  const c2 = src.getContext("2d");
  c2.fillStyle = "#f59e0b"; c2.fillRect(0, 0, 64, 64);
  c2.fillStyle = "#1e3a8a"; c2.fillRect(0, 0, 32, 32); c2.fillRect(32, 32, 32, 32);
  c2.fillStyle = "white"; c2.beginPath(); c2.arc(32, 32, 14, 0, Math.PI * 2); c2.fill();
  const gl = document.getElementById("tex").getContext("webgl");
  const p = prog(gl, "attribute vec2 a_pos; varying vec2 v_uv; void main() { v_uv = (a_pos * 0.5 + 0.5) * vec2(2.0, 1.5); gl_Position = vec4(a_pos, 0.0, 1.0); }",
    "precision mediump float; varying vec2 v_uv; uniform sampler2D u_tex; uniform float u_alpha;\nvoid main() { vec4 c = texture2D(u_tex, v_uv); gl_FragColor = vec4(c.rgb, u_alpha); }");
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.uniform1i(gl.getUniformLocation(p, "u_tex"), 0);
  gl.uniform1f(gl.getUniformLocation(p, "u_alpha"), 0.85);
  gl.clearColor(1, 1, 1, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  buf(gl, [-0.9, -0.9, 0.9, -0.9, -0.9, 0.9, 0.9, 0.9], "a_pos", 2, p);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  log("2 texture: error " + gl.getError());
}

// 3. A lit, rotated cube with indices, perspective and the depth test.
{
  const gl = document.getElementById("cube").getContext("webgl");
  const p = prog(gl,
    "attribute vec3 a_pos; attribute vec3 a_n; uniform mat4 u_mvp; uniform mat3 u_nm; varying vec3 v_n;\nvoid main() { v_n = u_nm * a_n; gl_Position = u_mvp * vec4(a_pos, 1.0); }",
    "precision mediump float; varying vec3 v_n; uniform vec3 u_col;\nvoid main() { float d = max(dot(normalize(v_n), normalize(vec3(0.4, 0.7, 1.0))), 0.0); gl_FragColor = vec4(u_col * (0.25 + 0.75 * d), 1.0); }");
  const pos = [], nrm = [], idx = [];
  const faces = [[0, 0, 1], [0, 0, -1], [0, 1, 0], [0, -1, 0], [1, 0, 0], [-1, 0, 0]];
  faces.forEach((n, f) => {
    const u = n[0] ? [0, 1, 0] : [1, 0, 0], v = [n[1] * u[2] - n[2] * u[1], n[2] * u[0] - n[0] * u[2], n[0] * u[1] - n[1] * u[0]];
    for (const [a, b] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      pos.push(n[0] + a * u[0] + b * v[0], n[1] + a * u[1] + b * v[1], n[2] + a * u[2] + b * v[2]); nrm.push(...n);
    }
    idx.push(f * 4, f * 4 + 1, f * 4 + 2, f * 4, f * 4 + 2, f * 4 + 3);
  });
  buf(gl, pos, "a_pos", 3, p); buf(gl, nrm, "a_n", 3, p);
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
  const ax = 0.5, ay = 0.7, cx = Math.cos(ax), sx = Math.sin(ax), cy = Math.cos(ay), sy = Math.sin(ay);
  const r = [cy, sx * sy, -cx * sy, 0, cx, sx, sy, -sx * cy, cx * cy]; // rotation (column-major)
  const f = 1 / Math.tan(0.5), aspect = 200 / 150, n0 = 0.1, f0 = 20, dz = -5;
  const mvp = [
    f / aspect * r[0], f * r[1], (f0 + n0) / (n0 - f0) * r[2], -r[2],
    f / aspect * r[3], f * r[4], (f0 + n0) / (n0 - f0) * r[5], -r[5],
    f / aspect * r[6], f * r[7], (f0 + n0) / (n0 - f0) * r[8], -r[8],
    0, 0, (f0 + n0) / (n0 - f0) * dz + 2 * f0 * n0 / (n0 - f0), -dz,
  ];
  gl.uniformMatrix4fv(gl.getUniformLocation(p, "u_mvp"), false, mvp);
  gl.uniformMatrix3fv(gl.getUniformLocation(p, "u_nm"), false, r);
  gl.uniform3f(gl.getUniformLocation(p, "u_col"), 0.2, 0.7, 0.4);
  gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE);
  gl.clearColor(0.95, 0.95, 0.9, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.drawElements(gl.TRIANGLES, 36, gl.UNSIGNED_SHORT, 0);
  log("3 cube: error " + gl.getError());
}

// 4. WebGL 2: GLSL 3.00, a vertex array, instancing and a uniform block.
{
  const gl = document.getElementById("gl2").getContext("webgl2");
  const p = prog(gl,
    "#version 300 es\nlayout(location=0) in vec2 a_pos; layout(location=1) in vec2 a_off;\nuniform Colors { vec4 base; vec4 tint; };\nout vec4 v_col;\nvoid main() { v_col = mix(base, tint, float(gl_InstanceID) / 15.0); gl_Position = vec4(a_pos * 0.18 + a_off, 0.0, 1.0); }",
    "#version 300 es\nprecision highp float; in vec4 v_col; out vec4 o;\nvoid main() { o = v_col; }");
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  const offs = []; for (let i = 0; i < 16; i++) offs.push(-0.75 + (i % 4) * 0.5, -0.75 + Math.floor(i / 4) * 0.5);
  const ob = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, ob); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(offs), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 0, 0); gl.vertexAttribDivisor(1, 1);
  const ubo = gl.createBuffer(); gl.bindBuffer(gl.UNIFORM_BUFFER, ubo);
  gl.bufferData(gl.UNIFORM_BUFFER, new Float32Array([0.9, 0.2, 0.3, 1, 0.2, 0.3, 0.95, 1]), gl.STATIC_DRAW);
  gl.uniformBlockBinding(p, gl.getUniformBlockIndex(p, "Colors"), 2); gl.bindBufferBase(gl.UNIFORM_BUFFER, 2, ubo);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, 16);
  log("4 webgl2: error " + gl.getError() + ", " + gl.getParameter(gl.SHADING_LANGUAGE_VERSION));
}

// 5. Render to a texture through a framebuffer, then a procedural shader with derivatives.
{
  const gl = document.getElementById("fx").getContext("webgl");
  gl.getExtension("OES_standard_derivatives");
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 64, 64, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  const p1 = prog(gl, "attribute vec2 a_pos; void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }",
    "#extension GL_OES_standard_derivatives : enable\nprecision mediump float;\nvoid main() { vec2 q = gl_FragCoord.xy / 8.0; float r = length(fract(q) - 0.5); float w = fwidth(r);\n  gl_FragColor = vec4(mix(vec3(0.95, 0.5, 0.1), vec3(0.15, 0.1, 0.3), smoothstep(0.3 - w, 0.3 + w, r)), 1.0); }");
  const b = buf(gl, [-1, -1, 1, -1, -1, 1, 1, 1], "a_pos", 2, p1);
  gl.viewport(0, 0, 64, 64); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, 200, 150);
  const p2 = prog(gl, "attribute vec2 a_pos; varying vec2 v; void main() { v = a_pos; gl_Position = vec4(a_pos, 0.0, 1.0); }",
    "precision mediump float; varying vec2 v; uniform sampler2D u_t;\nvoid main() { float a = atan(v.y, v.x); float r = length(v);\n  vec2 uv = vec2(a / 6.2831853 + 0.5, r * 1.5); gl_FragColor = texture2D(u_t, uv) * (1.0 - 0.5 * r); }");
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  const loc = gl.getAttribLocation(p2, "a_pos"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  const px = new Uint8Array(4); gl.readPixels(100, 75, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  log("5 framebuffer: status " + (status === gl.FRAMEBUFFER_COMPLETE ? "complete" : status) + ", error " + gl.getError() + ", center alpha " + px[3]);
}

// 6. A 2D canvas drawing the WebGL triangle (drawImage reads the WebGL canvas) and toDataURL.
{
  const c = document.getElementById("copy").getContext("2d");
  c.fillStyle = "#e2e8f0"; c.fillRect(0, 0, 200, 150);
  c.drawImage(document.getElementById("tri"), 20, 15, 160, 120);
  const url = document.getElementById("cube").toDataURL();
  log("6 drawImage + toDataURL: " + (url.startsWith("data:image/png;base64,") && url.length > 500 ? "ok" : "bad " + url.slice(0, 30)));
}
</script>
</body></html>
