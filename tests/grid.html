<!DOCTYPE html>
<html><head><title>CSS grid test</title>
<style>
  body { margin: 0; font-family: sans-serif; color: #1f2937; background: #f8fafc; }
  .page { display: grid; grid-template-columns: 200px 1fr; grid-template-rows: auto 1fr auto;
          grid-template-areas: "head head" "nav main" "foot foot"; gap: 12px; padding: 12px; min-height: 300px; }
  header { grid-area: head; background: #1e293b; color: white; padding: 14px; border-radius: 8px; }
  nav { grid-area: nav; background: #e0e7ff; padding: 12px; border-radius: 8px; }
  main { grid-area: main; background: white; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; }
  footer { grid-area: foot; background: #334155; color: #cbd5e1; padding: 10px 14px; border-radius: 8px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
  .card { background: #fef3c7; border-radius: 8px; padding: 10px; }
  .wide { grid-column: span 2; background: #fde68a; }
  .bento { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 60px; gap: 8px; margin-top: 14px; }
  .bento div { background: #dcfce7; border-radius: 8px; padding: 8px; }
  .big { grid-column: 1 / 3; grid-row: 1 / 3; background: #86efac !important; }
  .tall { grid-row: span 2; background: #bbf7d0 !important; }
  .full { grid-column: 1 / -1; background: #4ade80 !important; }
  .center { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 14px; background: #fff; border: 1px dashed #94a3b8; padding: 6px; }
</style></head>
<body>
<div class="page">
  <header><b>grid-template-areas</b>: head / nav main / foot</header>
  <nav><b>Nav</b><br>200px column</nav>
  <main>
    <b>Main</b> takes the <code>1fr</code> column.
    <div class="cards">
      <div class="card">auto-fill</div><div class="card wide">span 2</div><div class="card">minmax(150px, 1fr)</div>
      <div class="card">four</div><div class="card">five</div><div class="card">six</div>
    </div>
    <div class="bento">
      <div class="big">1 / 3 by 1 / 3</div><div>a</div><div class="tall">span 2 rows</div><div>b</div>
      <div>c</div><div class="full">1 / -1 (full width)</div>
    </div>
    <div class="center"><span>left 1fr</span><b>auto middle</b><span style="text-align:right">right 1fr</span></div>
  </main>
  <footer>Footer spans both columns</footer>
</div>
</body></html>
