<!DOCTYPE html>
<html><head><title>Scrollable boxes</title>
<style>
  body { font-family: sans-serif; margin: 20px; color: #1e293b; }
  .row { display: flex; gap: 20px; align-items: flex-start; }
  .chat { width: 260px; height: 220px; overflow-y: auto; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; background: #f8fafc; }
  .msg { background: #e0e7ff; border-radius: 8px; padding: 6px 10px; margin: 6px 0; }
  .msg.me { background: #dcfce7; margin-left: 40px; }
  .list { width: 220px; max-height: 160px; overflow: auto; border: 1px solid #cbd5e1; border-radius: 8px; padding: 4px 12px; }
  .list a { display: block; padding: 4px 0; color: #4f46e5; }
  .clip { width: 200px; height: 70px; overflow: hidden; border: 2px dashed #f59e0b; padding: 6px; }
  .tall { min-height: 120px; max-height: 300px; background: #fef3c7; margin-top: 16px; padding: 8px; width: 300px; }
  #log { color: #475569; font-size: 13px; }
</style></head>
<body>
<h1>Scrollable boxes</h1>
<div class="row">
  <div class="chat" id="chat"></div>
  <div class="list" id="list"></div>
  <div class="clip">overflow: hidden cuts this text off after a few lines. Line two of the text. Line three of the text. Line four is hidden. Line five is hidden too.</div>
</div>
<div class="tall">min-height: 120px — this box is taller than its one line of text.</div>
<p id="log"></p>
<script>
const chat = document.getElementById("chat");
for (let i = 1; i <= 12; i++) {
  const m = document.createElement("div");
  m.className = i % 3 ? "msg" : "msg me";
  m.textContent = "Message " + i + (i % 3 ? " from a friend" : " from me");
  chat.appendChild(m);
}
chat.scrollTop = chat.scrollHeight; // like a chat app: show the newest message
const list = document.getElementById("list");
for (let i = 1; i <= 15; i++) { const a = document.createElement("a"); a.href = "#item" + i; a.textContent = "List item " + i; list.appendChild(a); }
document.getElementById("log").textContent =
  `chat: scrollTop ${Math.round(chat.scrollTop)} of ${chat.scrollHeight - chat.clientHeight} (scrollHeight ${chat.scrollHeight}), list max-height box is ${list.offsetHeight}px tall`;
list.addEventListener("click", (e) => { document.getElementById("log").textContent = "Clicked: " + e.target.textContent.trim(); });
</script>
</body></html>
