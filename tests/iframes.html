<!DOCTYPE html><html><head><title>Iframes</title>
<style>body{font:16px sans-serif;margin:20px} .wide{width:460px;height:170px;border:1px solid #888}</style></head>
<body>
<h1>Iframes</h1>
<p>A file in an iframe (CSS-sized, with a nested frame inside):</p>
<iframe class="wide" src="frame-child.html"></iframe>
<p>srcdoc with a script, default size:</p>
<iframe srcdoc="<body style='background:#e8ffe8;font:14px sans-serif'><b id=x>waiting</b><script>document.getElementById('x').textContent='srcdoc script ran'</script></body>"></iframe>
<iframe src="about:blank" width="120" height="60"></iframe>
<p>After the frames.</p>
</body></html>
