<!DOCTYPE html><html><head><title>jQuery</title>
<style>body{font-family:sans-serif;margin:24px} .box{padding:10px;border:1px solid #ccc;border-radius:6px;margin:8px 0} .hl{background:#fef3c7}</style>
<script src="jquery.min.js"></script></head>
<body><h1 id="title">jQuery test</h1><div class="box" id="a">Box A</div><div class="box">Box B</div><ul id="list"></ul><p id="out"></p>
<script>
$(function () {
  $("#title").text("jQuery " + $.fn.jquery + " running in Swiftiron");
  $(".box").addClass("hl").first().append(" <b>(first, highlighted)</b>");
  ["one", "two", "three"].forEach((t) => $("<li>").text("item " + t).appendTo("#list"));
  $("#list li:last-child").css("color", "rebeccapurple");
  const n = $(".box").length, w = $("#a").outerWidth();
  $("#out").html("Found <b>" + n + "</b> boxes; #a is " + w + "px wide; data(): " + $("#a").data("x", 42).data("x"));
  $.each({ a: 1, b: 2 }, (k, v) => $("#out").append(" " + k + "=" + v));
});
</script></body></html>
