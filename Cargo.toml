[package]
name = "ironswift"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A web browser engine written from scratch in Rust"
repository = "https://github.com/hirejohndougan-art/lighteningfox"

[dependencies]
winit = "0.30"
softbuffer = "0.4"
png = "0.17"
# 2D drawing for <canvas>: anti-aliased paths, strokes, gradients, patterns, blend modes.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
# annex-b: the legacy web parts of JavaScript every browser has (substr, escape, <!-- comments…).
boa_engine = { version = "0.22", features = ["intl_bundled", "annex-b"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
base64 = "0.22"
serde_json = "1"
wuff = "0.2"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
ab_glyph = "0.2"
rustybuzz = "0.20.1"
wgpu = { version = "30.0.2", default-features = false, features = ["vulkan", "gles", "wgsl"], optional = true }
pollster = { version = "1.0.1", optional = true }
raw-window-handle = "0.6"
reqwest = { version = "0.13", features = ["blocking", "brotli", "zstd", "gzip", "deflate", "http3", "socks"] }
encoding_rs = "0.8.44"
url = "2.5.8"
tokio = { version = "1.54.1", features = ["rt"] }
sha2 = "0.10"
unicode-linebreak = "0.1"
hypher = "0.1"
swash = "0.2"
libc = "0.2"
resvg = "0.50.0"
zenavif = "0.1.6"
rgb = "0.8.53"
zenpixels = "0.2"
regress = "0.12"
fluent-bundle = "0.16"
unic-langid = "0.9"
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
accesskit = "0.25"
accesskit_unix = "0.24"
unicode-bidi = "0.3"
# Geolocation: GeoClue over D-Bus (zbus is already built for accesskit_unix).
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
# Styling across CPU cores (src/parallel.rs).
rayon = "1"

[dev-dependencies]
# Tests talk to a pretend GeoClue over a socket pair (src/geo.rs).
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api", "p2p"] }

[profile.release]
opt-level = 3

[features]
default = ["gpu"]
# Draw with the graphics card (Vulkan or OpenGL); falls back to software drawing at run time.
gpu = ["dep:wgpu", "dep:pollster"]

# Ironswift's own copy of the Boa JavaScript engine (batch M: Boa speed work). The changes
# are listed in vendor/boa/IRONSWIFT.md.
[patch.crates-io]
boa_engine = { path = "vendor/boa/boa_engine" }
boa_gc = { path = "vendor/boa/boa_gc" }
boa_ast = { path = "vendor/boa/boa_ast" }
boa_parser = { path = "vendor/boa/boa_parser" }
boa_interner = { path = "vendor/boa/boa_interner" }
boa_string = { path = "vendor/boa/boa_string" }
boa_macros = { path = "vendor/boa/boa_macros" }
