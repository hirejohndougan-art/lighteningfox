[package]
name = "lighteningfox"
version = "0.1.0"
edition = "2024"

[dependencies]
minifb = "0.27"
ureq = "2"
png = "0.17"
boa_engine = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
base64 = "0.22"
wuff = "0.2"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
ab_glyph = "0.2"
rustybuzz = "0.20.1"

[profile.release]
opt-level = 3
