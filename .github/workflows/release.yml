name: Release
# Push a tag like v0.2.0 to publish a release (or run it by hand to just build the packages).
# It attaches:
#   ironswift-linux-x86_64 (+ .sha256)   the program; installed copies update themselves from
#                                        this within a day (src/updates.rs checks the SHA-256)
#   ironswift_<v>_amd64.deb              Debian, Ubuntu, Mint, Pop!_OS…
#   Ironswift-<v>-x86_64.AppImage        any distribution
#   ironswift-<v>-linux-x86_64.tar.gz    unpack-and-run, installs into your home folder
#   Ironswift-<v>.flatpak                Flatpak bundle
#   ironswift-<v>-windows-x86_64.zip     Windows: unzip and run ironswift.exe
#   Ironswift-<v>-macos-arm64.zip        macOS (Apple silicon): Ironswift.app, not yet signed
#   SHA256SUMS                           checksums of everything above
# Built on the oldest supported Ubuntu so the packages run on more systems (glibc 2.35+).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core libxkbcommon-dev libwayland-dev libx11-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Cargo.toml says $v, tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Build
        run: cargo build --release
      - name: Packages (.deb, AppImage, .tar.gz)
        run: SKIP_BUILD=1 sh packaging/build-packages.sh all
      - name: The program on its own (for automatic updates)
        run: |
          cp target/release/ironswift dist/ironswift-linux-x86_64
          strip dist/ironswift-linux-x86_64
          (cd dist && sha256sum ironswift-linux-x86_64 > ironswift-linux-x86_64.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: Ironswift.flatpak
          manifest-path: packaging/flatpak/io.github.hirejohndougan_art.Ironswift.yml
          cache-key: flatpak-${{ github.sha }}
          upload-artifact: true

  windows-and-macos:
    # The program plus DejaVu (the default font; Windows and macOS don't have it) in fonts/.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: DejaVu fonts
        shell: bash
        run: |
          curl -fsSL -o dejavu.zip https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.zip
          unzip -q dejavu.zip
          mkdir -p fonts
          cp dejavu-fonts-ttf-2.37/ttf/DejaVuSans*.ttf dejavu-fonts-ttf-2.37/ttf/DejaVuSerif*.ttf fonts/
          cp dejavu-fonts-ttf-2.37/LICENSE fonts/DejaVu-LICENSE.txt
      - name: Package
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist
          if [ "$RUNNER_OS" = Windows ]; then
            d=ironswift-$v-windows-x86_64
            mkdir "$d"
            cp target/release/ironswift.exe "$d/"
            cp -r fonts README.md LICENSE* "$d/" 2>/dev/null || cp -r fonts README.md "$d/"
            7z a "dist/$d.zip" "$d" > /dev/null
          else
            app=Ironswift.app/Contents
            mkdir -p "$app/MacOS" "$app/Resources"
            cp target/release/ironswift "$app/MacOS/"
            cp -r fonts "$app/Resources/"
            cat > "$app/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Ironswift</string>
            <key>CFBundleIdentifier</key><string>io.github.hirejohndougan_art.Ironswift</string>
            <key>CFBundleExecutable</key><string>ironswift</string>
            <key>CFBundleVersion</key><string>$v</string>
            <key>CFBundleShortVersionString</key><string>$v</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict></plist>
          PLIST
            ditto -c -k --keepParent Ironswift.app "dist/Ironswift-$v-macos-arm64.zip"
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, flatpak, windows-and-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Gather files and checksums
        run: |
          mkdir dist
          find artifacts -type f -exec cp {} dist/ \;
          v=${GITHUB_REF_NAME#v}
          [ -f dist/Ironswift.flatpak ] && mv dist/Ironswift.flatpak "dist/Ironswift-$v.flatpak"
          (cd dist && rm -f SHA256SUMS && sha256sum * > SHA256SUMS)
          ls -l dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2)
          gh release create "$GITHUB_REF_NAME" dist/* --title "Ironswift $GITHUB_REF_NAME" --notes "$notes"
