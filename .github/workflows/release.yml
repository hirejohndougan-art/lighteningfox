name: Release
# Pushing a version tag (git tag v0.2.0 && git push --tags) builds the Linux packages and
# attaches them to a GitHub release. Built on the oldest supported Ubuntu so the packages
# run on any distribution with glibc 2.35 or newer.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core libxkbcommon-dev libwayland-dev libx11-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build packages (.deb, AppImage, .tar.gz)
        run: sh packaging/build-packages.sh all
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
