name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        # DejaVu is the default font; Noto CJK and FreeFont are the fallback fonts the
        # text-shaping test page needs (Chinese/Japanese/Korean, Hindi, Thai, Hebrew); Noto Color
        # Emoji for the emoji test page.
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-noto-cjk fonts-noto-color-emoji fonts-freefont-ttf \
            libxkbcommon-dev libwayland-dev libx11-dev xvfb ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Unit, parser and screenshot tests
        run: cargo test --release
      - name: Speed regression check
        # Benchmarks and page render times against tools/perf-baseline.json, and the time to
        # the first window frame (under xvfb). CI machines are slower than the baseline's, so
        # the startup limit here is looser than the 300 ms target.
        env:
          PERF_STARTUP_LIMIT_MS: "600"
        run: python3 tools/perf_check.py
      - name: Keep screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: target/screenshot-diffs/

  build-without-gpu:
    # The software-only build (no wgpu) must keep compiling.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --no-default-features
