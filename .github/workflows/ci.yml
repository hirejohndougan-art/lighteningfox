name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    # A new compiler warning fails the build (set for every step, so the tests reuse the build).
    # RUSTFLAGS replaces .cargo/config.toml's flags, so it repeats them (reqwest's HTTP/3).
    env:
      RUSTFLAGS: "--cfg reqwest_unstable -D warnings"
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        # DejaVu is the default font; Noto CJK and FreeFont are the fallback fonts the
        # text-shaping test page needs (Chinese/Japanese/Korean, Hindi, Thai, Hebrew); Noto Color
        # Emoji for the emoji test page.
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-noto-cjk fonts-noto-color-emoji fonts-freefont-ttf \
            libxkbcommon-dev libwayland-dev libx11-dev xvfb ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Unit, parser and screenshot tests
        run: cargo test --release
      - name: The same tests with every function compiled by the JIT
        # The JIT is on by default but only compiles busy functions; BOA_JIT=always compiles
        # each one on first use, so every script in the tests runs as machine code.
        env:
          BOA_JIT: always
        run: |
          ./target/release/ironswift --a11y tests/jit-check.html | grep "JIT check: ok"
          cargo test --release
      - name: Speed regression check
        # Benchmarks and page render times against tools/perf-baseline.json, and the time to
        # the first window frame (under xvfb). CI machines are slower than the baseline's, so
        # the startup limit here is looser than the 300 ms target.
        env:
          PERF_STARTUP_LIMIT_MS: "600"
        run: python3 tools/perf_check.py
      - name: Keep screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: target/screenshot-diffs/

  build-without-gpu:
    # The software-only build (no wgpu) must keep compiling, without warnings.
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "--cfg reqwest_unstable -D warnings"
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --no-default-features

  linux-arm64:
    # The JIT emits ARM64 code here (Cranelift's aarch64 back end, with BTI where the CPU has it).
    runs-on: ubuntu-24.04-arm
    env:
      RUSTFLAGS: "--cfg reqwest_unstable -D warnings"
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core libxkbcommon-dev libwayland-dev libx11-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: The JIT on ARM64
        env:
          BOA_JIT: always
        run: |
          ./target/release/ironswift --a11y tests/jit-check.html | grep "JIT check: ok"
          ./target/release/ironswift --png jit-check.png tests/js-demo.html
          cargo test --release --bin ironswift -- --skip screenshot --skip text_shaping --skip page_tests

  windows-and-macos:
    # The browser must build on Windows and macOS too, and draw a page there (headless, with
    # the system's own fonts: Arial and Consolas, or Arial and Courier New).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: "--cfg reqwest_unstable -D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Draw test pages
        shell: bash
        run: |
          mkdir -p shots
          for p in css3 forms grid js-demo; do
            ./target/release/ironswift --png "shots/$p.png" --width 1000 "tests/$p.html"
          done
          ls -la shots
          # One picture in the log as base64, for reviewers who can't download artifacts.
          py=$(command -v python3 || command -v python)
          echo "BEGIN-SHOT"; "$py" -c "import base64,sys; print(base64.b64encode(open(sys.argv[1],'rb').read()).decode())" shots/forms.png; echo "END-SHOT"
      - name: The real window (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools/windows_smoke.ps1
      - name: Unit tests that don't depend on Linux fonts
        run: cargo test --release --bin ironswift -- --skip screenshot --skip text_shaping --skip page_tests
      - name: The JIT on this platform
        shell: bash
        env:
          BOA_JIT: always
        run: |
          ./target/release/ironswift --a11y tests/jit-check.html | grep "JIT check: ok"
          cargo test --release --bin ironswift -- --skip screenshot --skip text_shaping --skip page_tests
      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.os }}
          path: shots/
