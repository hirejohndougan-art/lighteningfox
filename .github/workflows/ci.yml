name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core libxkbcommon-dev libwayland-dev libx11-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Unit and screenshot tests
        run: cargo test --release
      - name: Keep screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: target/screenshot-diffs/
