name: X1 record sites
# Temporary (task X1): record the broken sites so they can be replayed offline.
on:
  push:
    branches: [x1-record]
permissions:
  contents: write
jobs:
  rec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-noto-core libxkbcommon-dev libwayland-dev libx11-dev gdb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: cargo build --release
      - name: Record
        run: |
          mkdir -p out
          for u in https://apnews.com/ https://developer.mozilla.org/en-US/ https://www.bing.com/ https://www.bbc.com/news https://www.nytimes.com/ https://www.theguardian.com/ https://www.rust-lang.org/ https://wordpress.org/; do
            s=$(echo "$u" | sed -E 's#https?://##; s#[^a-zA-Z0-9]+#-#g; s#-$##')
            mkdir -p out/$s; prof=$(mktemp -d)
            IRONSWIFT_PROFILE=$prof IRONSWIFT_NO_UPDATES=1 IRONSWIFT_RECORD=$PWD/out/$s/rec ./target/release/ironswift --width 1280 --png out/$s/iron.png "$u" > out/$s/run.log 2>&1 &
            pid=$!
            for i in $(seq 1 60); do kill -0 $pid 2>/dev/null || break; sleep 1; done
            if kill -0 $pid 2>/dev/null; then
              echo "HUNG after 60s" >> out/$s/run.log
              sudo gdb -p $pid -batch -ex "thread apply all bt 40" > out/$s/bt.txt 2>&1 || true
              sleep 10; sudo gdb -p $pid -batch -ex "thread apply all bt 40" > out/$s/bt2.txt 2>&1 || true
              kill -9 $pid
            fi
            rc=0; wait $pid || rc=$?; echo "exit $rc" >> out/$s/run.log
            google-chrome --headless=new --disable-gpu --no-sandbox --hide-scrollbars --window-size=1280,2000 --screenshot=$PWD/out/$s/chrome.png "$u" >/dev/null 2>&1 || true
            echo "== $u"; tail -5 out/$s/run.log
          done
          cat out/apnews-com/bt.txt | head -150 || true
      - name: Push recordings
        run: |
          cd out
          git init -q -b x1-data
          git config user.name "John Dougan"
          git config user.email "289271172+hirejohndougan-art@users.noreply.github.com"
          git add -A
          git commit -qm "X1 site recordings"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" x1-data
