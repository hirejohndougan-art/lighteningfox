name: Record sites
# Record live sites with Ironswift so they can be replayed offline (docs/SITE_DEBUGGING.md).
# Start it with (the REST API: `gh workflow run` needs GraphQL, which chats can't use):
#   gh api -X POST repos/hirejohndougan-art/lighteningfox/actions/workflows/record-sites.yml/dispatches \
#     -f ref=main -f "inputs[urls]=https://www.bbc.com/news https://www.nytimes.com/" -f "inputs[branch]=rec-bbc-nyt"
# Each site's responses, Ironswift's log and screenshot, Chrome's screenshot and (if it hung)
# backtraces are pushed to the branch named, which is replaced each time. Built from `ref`.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Sites to record, separated by spaces"
        required: true
      branch:
        description: "Branch to push the recordings to (replaced)"
        required: true
      ref:
        description: "Which commit or branch of Ironswift to build"
        required: false
        default: main
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-noto-core libxkbcommon-dev libwayland-dev libx11-dev gdb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: cargo build --release
      - name: Record
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir -p out
          for u in $URLS; do
            s=$(echo "$u" | sed -E 's#https?://##; s#[^a-zA-Z0-9]+#-#g; s#-$##')
            mkdir -p out/$s; prof=$(mktemp -d)
            RUST_BACKTRACE=1 IRONSWIFT_PROFILE=$prof IRONSWIFT_NO_UPDATES=1 IRONSWIFT_RECORD=$PWD/out/$s/rec \
              ./target/release/ironswift --width 1280 --png out/$s/iron.png "$u" > out/$s/run.log 2>&1 &
            pid=$!
            for i in $(seq 1 90); do kill -0 $pid 2>/dev/null || break; sleep 1; done
            if kill -0 $pid 2>/dev/null; then
              echo "HUNG after 90s" >> out/$s/run.log
              sudo gdb -p $pid -batch -ex "thread apply all bt 40" > out/$s/bt.txt 2>&1 || true
              sleep 10; sudo gdb -p $pid -batch -ex "thread apply all bt 40" > out/$s/bt2.txt 2>&1 || true
              kill -9 $pid
            fi
            rc=0; wait $pid || rc=$?; echo "exit $rc" >> out/$s/run.log
            google-chrome --headless=new --disable-gpu --no-sandbox --hide-scrollbars --window-size=1280,2000 \
              --screenshot=$PWD/out/$s/chrome.png "$u" >/dev/null 2>&1 || true
            echo "== $u"; tail -3 out/$s/run.log
          done
      - name: Push recordings
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          cd out
          git init -q -b "$BRANCH"
          git config user.name "John Dougan"
          git config user.email "289271172+hirejohndougan-art@users.noreply.github.com"
          git add -A
          git commit -qm "Site recordings: ${{ inputs.urls }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$BRANCH"
